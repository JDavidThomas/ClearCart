openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vision
    description: Vision-assisted product identification
  - name: recalls
    description: Government recall data sources
  - name: auth
    description: Profile authentication and preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vision/identify-food:
    post:
      operationId: identifyFood
      tags: [vision]
      summary: Identify a food product from a photo
      description: Uses server-side vision processing to return a simple product name when one can be identified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyFoodRequest"
      responses:
        "200":
          description: Identified product name, or null when the image is not confidently identifiable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyFoodPayload"
        "400":
          description: Invalid image payload
        "503":
          description: Vision service unavailable
  /recalls/fsis:
    get:
      operationId: getFsisRecalls
      tags: [recalls]
      summary: Get recent active USDA FSIS recalls
      description: Returns recent active FSIS recalls fetched through the server-side proxy.
      responses:
        "200":
          description: Recent active USDA FSIS recalls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsisRecallResponse"
        "502":
          description: USDA FSIS is unavailable
  /auth/signup:
    post:
      operationId: authSignUp
      tags: [auth]
      summary: Create a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsPayload"
      responses:
        "200":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "400":
          description: Invalid sign-up details
  /auth/login:
    post:
      operationId: authLogIn
      tags: [auth]
      summary: Log in to a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsPayload"
      responses:
        "200":
          description: Authenticated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: authGetMe
      tags: [auth]
      summary: Get the current profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfilePayload"
        "401":
          description: Missing or invalid session
  /auth/profile:
    put:
      operationId: authUpdateProfile
      tags: [auth]
      summary: Update profile preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProfileUpdatePayload"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfilePayload"
        "401":
          description: Missing or invalid session
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IdentifyFoodRequest:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
      required:
        - imageBase64
        - mimeType
    IdentifyFoodPayload:
      type: object
      properties:
        productName:
          type:
            - string
            - "null"
      required:
        - productName
    FsisRecall:
      type: object
      properties:
        id:
          type: string
        productName:
          type: string
        companyName:
          type: string
        reason:
          type: string
        date:
          type: string
        classification:
          type: string
        summary:
          type: string
        officialUrl:
          type: string
          format: uri
        recallType:
          type: string
        relatedToOutbreak:
          type: boolean
      required:
        - id
        - productName
        - companyName
        - reason
        - date
        - classification
        - summary
        - officialUrl
        - recallType
        - relatedToOutbreak
    FsisRecallResponse:
      type: object
      properties:
        recalls:
          type: array
          items:
            $ref: "#/components/schemas/FsisRecall"
        lastUpdated:
          type: string
          format: date-time
      required:
        - recalls
        - lastUpdated
    AuthCredentialsPayload:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 2
      required:
        - email
        - password
    AuthProfileUpdatePayload:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        allergies:
          type: array
          items:
            type: string
      required:
        - allergies
    AuthProfilePayload:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        allergies:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - email
        - allergies
    AuthSessionPayload:
      type: object
      properties:
        accessToken:
          type:
            - string
            - "null"
        refreshToken:
          type:
            - string
            - "null"
        profile:
          anyOf:
            - $ref: "#/components/schemas/AuthProfilePayload"
            - type: "null"
        requiresEmailConfirmation:
          type: boolean
      required:
        - accessToken
        - refreshToken
        - profile
        - requiresEmailConfirmation

