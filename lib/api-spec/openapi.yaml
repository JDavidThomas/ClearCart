openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vision
    description: Vision-assisted product identification
  - name: recalls
    description: Government recall data sources
  - name: auth
    description: Profile authentication and preferences
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vision/identify-food:
    post:
      operationId: identifyFood
      tags: [vision]
      summary: Identify a food product from a photo
      description: Uses server-side vision processing to return a simple product name when one can be identified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyFoodRequest"
      responses:
        "200":
          description: Identified product name, or null when the image is not confidently identifiable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyFoodPayload"
        "400":
          description: Invalid image payload
        "503":
          description: Vision service unavailable
  /recalls/fda:
    get:
      operationId: getFdaRecalls
      tags: [recalls]
      summary: Search FDA recall records and notices
      description: Searches OpenFDA food enforcement records through the server-side proxy.
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching FDA enforcement recalls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenFdaRecallResponse"
        "400":
          description: Invalid search query
        "502":
          description: OpenFDA is unavailable
  /recalls/news:
    get:
      operationId: getRecallNews
      tags: [recalls]
      summary: Search recent recall news mentions
      description: Searches NewsAPI for matching articles published during the previous 30 days. Pass brand and productName for product-specific recall news. An unavailable news source returns an empty list.
      parameters:
        - name: term
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: brand
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: productName
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Recent recall-related news articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNewsResponse"
        "400":
          description: Invalid product search term
  /auth/signup:
    post:
      operationId: authSignUp
      tags: [auth]
      summary: Create a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsPayload"
      responses:
        "200":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "400":
          description: Invalid sign-up details
  /auth/login:
    post:
      operationId: authLogIn
      tags: [auth]
      summary: Log in to a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsPayload"
      responses:
        "200":
          description: Authenticated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionPayload"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: authGetMe
      tags: [auth]
      summary: Get the current profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfilePayload"
        "401":
          description: Missing or invalid session
  /auth/profile:
    put:
      operationId: authUpdateProfile
      tags: [auth]
      summary: Update profile preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProfileUpdatePayload"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfilePayload"
        "401":
          description: Missing or invalid session
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IdentifyFoodRequest:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
      required:
        - imageBase64
        - mimeType
    IdentifyFoodPayload:
      type: object
      properties:
        productName:
          type:
            - string
            - "null"
      required:
        - productName
    OpenFdaRecall:
      type: object
      properties:
        recallNumber:
          type: string
        productDescription:
          type: string
        reasonForRecall:
          type: string
        recallingFirm:
          type: string
        recallDate:
          type: string
        classification:
          type: string
        status:
          type: string
        officialUrl:
          type: string
          format: uri
      required:
        - productDescription
        - reasonForRecall
        - recallingFirm
        - recallDate
        - classification
        - officialUrl
    OpenFdaRecallResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OpenFdaRecall"
      required:
        - results
    RecallNewsArticle:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        source:
          type: string
      required:
        - title
        - url
        - publishedAt
        - source
    RecallNewsDateRange:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
        - from
        - to
    RecallNewsResponse:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/RecallNewsArticle"
        unavailable:
          type: boolean
        dateRange:
          $ref: "#/components/schemas/RecallNewsDateRange"
      required:
        - articles
        - unavailable
        - dateRange
    AuthCredentialsPayload:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 2
      required:
        - email
        - password
    AuthProfileUpdatePayload:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        allergies:
          type: array
          items:
            type: string
      required:
        - allergies
    AuthProfilePayload:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        allergies:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - email
        - allergies
    AuthSessionPayload:
      type: object
      properties:
        accessToken:
          type:
            - string
            - "null"
        refreshToken:
          type:
            - string
            - "null"
        profile:
          anyOf:
            - $ref: "#/components/schemas/AuthProfilePayload"
            - type: "null"
        requiresEmailConfirmation:
          type: boolean
      required:
        - accessToken
        - refreshToken
        - profile
        - requiresEmailConfirmation

